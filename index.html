```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-width: 900px;
      height: auto;
    }
  </style>
</head>

<body>

  <video id="myVideo" autoplay loop playsinline controls>
    <source src="bella ciao2.mp4" type="video/mp4">
    Your browser does not support video playback.
  </video>

  <script>
    const video = document.getElementById("myVideo");

    // Auto play with sound
    video.muted = false;
    video.volume = 1.0;

    video.play().catch(() => {
      console.log("Browser blocked autoplay with sound.");
    });
  </script>

</body>
</html>
